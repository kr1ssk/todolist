# Configuración Dinámica de Base de Datos (Local / Docker / Railway)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/todolist_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Integración Externa Meteorológica
openmeteo.base-url=${OPENMETEO_BASE_URL:https://api.open-meteo.com}

# Spring Security - JWT (Clave con fallback seguro de 32 caracteres mínimo)
jwt.secret=${JWT_SECRET:bibliotecaduoc-clave-secreta-jwt-2026-cambiar-en-produccion}

# Desactivar conflicto de compatibilidad entre HATEOAS y Swagger UI
springdoc.enable-hateoas=false